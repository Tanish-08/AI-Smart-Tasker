[pytest]
# Pytest configuration for AI Task Manager

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = backend/test

# Console output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=backend.app
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    db: Tests requiring database
    llm: Tests requiring LLM client

# Coverage options
[coverage:run]
source = backend.app
omit =
    */test/*
    */tests/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
